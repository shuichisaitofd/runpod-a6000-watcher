name: A6000 sniper (veda-test)
on:
  workflow_dispatch:
    inputs:
      auto_deploy:
        description: "空いたら自動でdeployする"
        type: boolean
        default: true
concurrency:
  group: a6000-sniper-veda
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Watch
        env:
          KEY: ${{ secrets.RUNPOD_API_KEY }}
          TOPIC: ${{ secrets.NTFY_TOPIC }}
          AUTO_DEPLOY: ${{ inputs.auto_deploy }}
          TEMPLATE_ID: rp0bq9dcco   # H3 Mobile - veda 10max long
          POD_NAME: h3-veda-10max-long
          TAG: "[veda-10max-long]"
        run: |
          set +e
          if [ -z "$KEY" ] || [ -z "$TOPIC" ]; then
            echo "Secrets RUNPOD_API_KEY / NTFY_TOPIC are not set"; exit 1
          fi
          notify() { curl -s -H "Priority: ${2:-default}" -H "Click: ${3:-https://console.runpod.io/pods}" -d "$TAG $1" "https://ntfy.sh/$TOPIC" > /dev/null; }
          gql() { curl -s --max-time 30 https://api.runpod.io/graphql -H "Content-Type: application/json" -H "Authorization: Bearer $KEY" -d "$1"; }

          # Always use the template's CURRENT image (no hardcoded tag)
          template_image() {
            gql '{"query":"query { myself { podTemplates { id imageName } } }"}' \
              | jq -r --arg id "$TEMPLATE_ID" '.data.myself.podTemplates[]? | select(.id==$id) | .imageName' 2>/dev/null | head -n1
          }
          IMG=$(template_image)
          if [ -z "$IMG" ]; then
            notify "テンプレートのイメージが取得できず監視停止"; exit 1
          fi
          echo "Template image: $IMG"

          STOCK_Q='{"query":"query { gpuTypes(input:{id:\"NVIDIA RTX A6000\"}) { lowestPrice(input:{gpuCount:1, secureCloud:true}) { stockStatus } } }"}'

          if [ "$AUTO_DEPLOY" = "true" ]; then
            notify "監視スタート（自動deploy ON）"
          else
            notify "監視スタート（通知のみ）"
          fi

          TRIES=0
          for i in $(seq 1 1980); do
            RES=$(gql "$STOCK_Q")
            if ! echo "$RES" | jq -e . > /dev/null 2>&1; then
              echo "$(date +%T) stock API not JSON, retrying"; sleep 15; continue
            fi
            STATUS=$(echo "$RES" | jq -r '.data.gpuTypes[0].lowestPrice.stockStatus // "None"' 2>/dev/null)
            [ -z "$STATUS" ] && STATUS=None
            if [ "$STATUS" = "None" ]; then
              echo "$(date +%T) stock=None"; sleep 10; continue
            fi

            if [ "$AUTO_DEPLOY" != "true" ]; then
              notify "RTX A6000 空きました！($STATUS) タップで開く" urgent https://console.runpod.io/deploy
              exit 0
            fi

            # Re-read the template image right before deploying (picks up tag updates mid-run)
            NEW_IMG=$(template_image); [ -n "$NEW_IMG" ] && IMG="$NEW_IMG"

            TRIES=$((TRIES+1))
            DEPLOY_Q=$(jq -n --arg tid "$TEMPLATE_ID" --arg name "$POD_NAME" --arg img "$IMG" \
              '{query: ("mutation { podFindAndDeployOnDemand(input: { cloudType: SECURE, gpuCount: 1, gpuTypeId: \"NVIDIA RTX A6000\", name: \"" + $name + "\", templateId: \"" + $tid + "\", imageName: \"" + $img + "\", containerDiskInGb: 150, volumeInGb: 100, volumeMountPath: \"/workspace\", minCudaVersion: \"13.0\" }) { id imageName machineId } }")}')
            DR=$(gql "$DEPLOY_Q")
            POD_ID=$(echo "$DR" | jq -r '.data.podFindAndDeployOnDemand.id // empty' 2>/dev/null)
            if [ -n "$POD_ID" ]; then
              echo "DEPLOYED pod=$POD_ID image=$(echo "$DR" | jq -r '.data.podFindAndDeployOnDemand.imageName' 2>/dev/null) after $TRIES tries"
              notify "✅ RTX A6000 確保しました！課金中です。タップでPod一覧を開く" urgent https://console.runpod.io/pods
              exit 0
            fi
            MSG=$(echo "$DR" | jq -r '.errors[0].message // "no message"' 2>/dev/null)
            echo "$(date +%T) stock=$STATUS deploy try $TRIES failed: $(echo "$MSG" | head -c 200)"
            if echo "$MSG" | grep -qiE 'unauthor|permission|forbidden'; then
              notify "deploy権限エラー。監視停止"; exit 1
            fi
            if echo "$MSG" | grep -qiE 'unknown argument|cannot query|not defined|expected type|syntax'; then
              notify "deployの命令が拒否されたため監視停止。ログを確認してください"; exit 1
            fi
            sleep 10
          done
          notify "5時間経過、監視終了（確保できず）"
