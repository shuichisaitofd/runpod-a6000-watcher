name: A6000 sniper (veda-test)
on:
  workflow_dispatch:
    inputs:
      auto_deploy:
        description: "空いたら自動でdeployする"
        type: boolean
        default: true
concurrency:
  group: a6000-sniper-veda
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Watch
        env:
          KEY: ${{ secrets.RUNPOD_API_KEY }}
          TOPIC: ${{ secrets.NTFY_TOPIC }}
          AUTO_DEPLOY: ${{ inputs.auto_deploy }}
        run: |
          set +e
          if [ -z "$KEY" ] || [ -z "$TOPIC" ]; then
            echo "Secrets RUNPOD_API_KEY / NTFY_TOPIC are not set"; exit 1
          fi
          notify() { curl -s -H "Priority: ${2:-default}" -H "Click: ${3:-https://console.runpod.io/pods}" -d "$1" "https://ntfy.sh/$TOPIC" > /dev/null; }

          # Template "H3 Mobile - veda test" (image comes from the template)
          BODY=$(jq -n '{
            name: "h3-veda-auto",
            templateId: "8g2qn3j3o8",
            gpuTypeIds: ["NVIDIA RTX A6000"],
            gpuCount: 1,
            containerDiskInGb: 150,
            volumeInGb: 100,
            volumeMountPath: "/workspace",
            allowedCudaVersions: ["13.0"]
          }')

          # Plain Secure-cloud stock check (same as the version that worked).
          # The CUDA filter is applied by the deploy call itself.
          STOCK_Q='{"query":"query { gpuTypes(input:{id:\"NVIDIA RTX A6000\"}) { lowestPrice(input:{gpuCount:1, secureCloud:true}) { stockStatus } } }"}'

          if [ "$AUTO_DEPLOY" = "true" ]; then
            notify "[veda-test] 監視スタート（自動deploy ON）"
          else
            notify "[veda-test] 監視スタート（通知のみ）"
          fi

          BAD=0
          TRIES=0
          for i in $(seq 1 1980); do
            RES=$(curl -s --max-time 20 https://api.runpod.io/graphql \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $KEY" \
              -d "$STOCK_Q")

            # Non-JSON / empty response (temporary API hiccup): skip and retry
            if ! echo "$RES" | jq -e . > /dev/null 2>&1; then
              BAD=$((BAD+1))
              echo "$(date +%T) API response not JSON (count=$BAD), retrying"
              sleep 15
              continue
            fi
            if echo "$RES" | jq -e '.errors' > /dev/null 2>&1; then
              echo "$(date +%T) API error: $(echo "$RES" | jq -r '.errors[0].message' 2>/dev/null), retrying"
              sleep 15
              continue
            fi
            STATUS=$(echo "$RES" | jq -r '.data.gpuTypes[0].lowestPrice.stockStatus // "None"' 2>/dev/null)
            [ -z "$STATUS" ] && STATUS=None

            if [ "$STATUS" = "None" ]; then
              echo "$(date +%T) stock=None"
              sleep 10
              continue
            fi

            if [ "$AUTO_DEPLOY" != "true" ]; then
              notify "[veda-test] RTX A6000 空きました！($STATUS) タップで開く" urgent https://console.runpod.io/deploy
              exit 0
            fi

            TRIES=$((TRIES+1))
            HTTP=$(curl -s --max-time 30 -o resp.json -w "%{http_code}" -X POST https://rest.runpod.io/v1/pods \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $KEY" \
              -d "$BODY")
            POD_ID=$(jq -r '.id // empty' resp.json 2>/dev/null)

            if [ "${HTTP:0:1}" = "2" ] && [ -n "$POD_ID" ]; then
              echo "DEPLOYED pod=$POD_ID after $TRIES tries image=$(jq -r '.image // .imageName // \"?\"' resp.json 2>/dev/null)"
              notify "[veda-test] ✅ RTX A6000 確保しました！課金中です。タップでPod一覧を開く" urgent https://console.runpod.io/pods
              exit 0
            fi

            echo "$(date +%T) stock=$STATUS deploy try $TRIES failed (HTTP $HTTP): $(head -c 200 resp.json 2>/dev/null)"
            if [ "$HTTP" = "401" ] || [ "$HTTP" = "403" ]; then
              notify "[veda-test] deploy権限エラー。監視停止"
              exit 1
            fi
            sleep 10
          done
          notify "[veda-test] 5時間経過、監視終了（確保できず）"
