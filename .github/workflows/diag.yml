name: Diagnose (read-only)
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: List templates (read-only, no pod creation)
        env:
          KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          set +e
          curl -s https://api.runpod.io/graphql \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $KEY" \
            -d '{"query":"query { myself { podTemplates { id name imageName containerDiskInGb volumeInGb volumeMountPath } } }"}' \
            | jq -c '.data.myself.podTemplates[]? // .' | head -c 4000
          echo
